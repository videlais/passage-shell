name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check for new dependencies
        run: |
          git fetch origin ${{ github.base_ref }}
          BASE=$(git show origin/${{ github.base_ref }}:package.json | jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' | sort)
          HEAD=$(jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' package.json | sort)
          NEW=$(comm -13 <(echo "$BASE") <(echo "$HEAD"))
          if [ -n "$NEW" ]; then
            echo "New dependencies detected — skipping auto-merge: $NEW"
            exit 1
          fi

      - name: Run tests with coverage
        run: npm test

      - name: Auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
